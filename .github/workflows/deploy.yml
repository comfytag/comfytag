name: Deploy Pipeline (Staging → Production)
on:
  push:
    branches:
      - main
concurrency:
  group: deployment
  cancel-in-progress: false
permissions:
  contents: read
  packages: write
  issues: write

jobs:
  quality-gate:
    name: 🔍 Quality Gate
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27018:27017
        env:
          MONGO_INITDB_ROOT_USERNAME: admin
          MONGO_INITDB_ROOT_PASSWORD: changeme
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.9
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: ✅ TypeScript Check
        run: pnpm typecheck
      - name: ✅ Linting
        run: pnpm --filter !@comfytag/partner lint
      - name: ✅ Build All Apps
        run: pnpm build
      - name: ✅ Unit & Integration Tests
        run: pnpm test:ci

  docker-build:
    name: 🐳 Docker Build & Push to GHCR
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: 🔐 Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 📝 Inject Frontend Environment Variables
        run: |
          # NEXT_PUBLIC_* vars are baked into the client bundle at build time —
          # this runs on the GitHub Actions runner, which never sees the VPS's
          # .env files, so anything the frontend needs at build time must be
          # set here, not just in apps/*/.env on the server.
          {
            echo "NEXT_PUBLIC_API_URL=https://api.comfytag.com"
            echo "NEXT_PUBLIC_PARTNER_URL=https://partner.comfytag.com"
          } > apps/web/.env.production
          {
            echo "NEXT_PUBLIC_API_URL=https://api.comfytag.com"
            echo "NEXT_PUBLIC_WEB_URL=https://comfytag.com"
          } > apps/partner/.env.production
          echo "NEXT_PUBLIC_API_URL=https://api.comfytag.com" > apps/admin/.env.production
      - name: 🔨 Build Docker images
        run: |
          # Building all 4 images in one `docker compose build` keeps every
          # app's deps+builder-stage cache (full node_modules + source) on
          # disk simultaneously, which reliably exhausts the runner's disk
          # partway through the 4th image. Build one app at a time and prune
          # the build cache between each — the final tagged images are kept,
          # only the intermediate layers are discarded.
          df -h /
          for app in api web partner admin; do
            echo "::group::Building $app"
            docker compose -f docker-compose.prod.yml build "$app"
            echo "::endgroup::"
            docker builder prune -af
            df -h /
          done
      - name: 🏷️ Tag Images for GHCR
        run: |
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          docker tag comfytag-api ghcr.io/$REPO_OWNER/comfytag-api:latest
          docker tag comfytag-web ghcr.io/$REPO_OWNER/comfytag-web:latest
          docker tag comfytag-partner ghcr.io/$REPO_OWNER/comfytag-partner:latest
          docker tag comfytag-admin ghcr.io/$REPO_OWNER/comfytag-admin:latest
      - name: 🚀 Push Images to GHCR
        run: |
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          docker push ghcr.io/$REPO_OWNER/comfytag-api:latest
          docker push ghcr.io/$REPO_OWNER/comfytag-web:latest
          docker push ghcr.io/$REPO_OWNER/comfytag-partner:latest
          docker push ghcr.io/$REPO_OWNER/comfytag-admin:latest
      - name: ✅ Validate docker-compose
        run: docker compose -f docker-compose.prod.yml config --no-interpolate > /dev/null || true
      - name: ✅ Verify Docker images
        run: |
          echo "Verifying Docker images..."
          docker run --rm comfytag-api node -e "console.log('API OK')" || exit 1
          docker run --rm comfytag-web node -e "console.log('Web OK')" || exit 1
          docker run --rm comfytag-partner node -e "console.log('Partner OK')" || exit 1
          docker run --rm comfytag-admin node -e "console.log('Admin OK')" || exit 1
          echo "✅ All Docker images valid"

  deploy-production:
    name: 🚀 Deploy to Production
    needs: [quality-gate, docker-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Deploy to production environment
        uses: appleboy/ssh-action@v1.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_OWNER: ${{ github.repository_owner }}
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          timeout: 60m
          command_timeout: 60m
          envs: GITHUB_TOKEN,REPO_OWNER
          script: |
            cd /home/deploy/comfytag

            echo "🏷️ Tagging the currently-running images as :rollback before replacing them..."
            for app in api web partner admin; do
              docker tag comfytag-$app:latest comfytag-$app:rollback 2>/dev/null || echo "  (no existing comfytag-$app:latest to tag — first deploy)"
            done
            PREVIOUS_COMMIT=$(cat DEPLOYED_COMMIT.txt 2>/dev/null || echo "unknown")
            cp DEPLOYED_COMMIT.txt DEPLOYED_COMMIT.txt.rollback 2>/dev/null || true

            echo "📡 Pulling latest code..."
            git pull origin main

            echo "🔐 Logging into GitHub Container Registry..."
            OWNER_LOWER=$(echo "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')
            echo $GITHUB_TOKEN | docker login ghcr.io -u $OWNER_LOWER --password-stdin

            echo "📥 Pulling pre-built Docker images..."
            docker pull ghcr.io/$OWNER_LOWER/comfytag-api:latest
            docker pull ghcr.io/$OWNER_LOWER/comfytag-web:latest
            docker pull ghcr.io/$OWNER_LOWER/comfytag-partner:latest
            docker pull ghcr.io/$OWNER_LOWER/comfytag-admin:latest

            echo "🔎 Verifying the exact digests just pulled (compare against this run's own push, not a cached/mutated tag)..."
            docker inspect --format='{{index .RepoDigests 0}}' ghcr.io/$OWNER_LOWER/comfytag-api:latest
            docker inspect --format='{{index .RepoDigests 0}}' ghcr.io/$OWNER_LOWER/comfytag-web:latest
            docker inspect --format='{{index .RepoDigests 0}}' ghcr.io/$OWNER_LOWER/comfytag-partner:latest
            docker inspect --format='{{index .RepoDigests 0}}' ghcr.io/$OWNER_LOWER/comfytag-admin:latest

            echo "🏷️ Re-tagging images so local compose recognizes them..."
            docker tag ghcr.io/$OWNER_LOWER/comfytag-api:latest comfytag-api:latest
            docker tag ghcr.io/$OWNER_LOWER/comfytag-web:latest comfytag-web:latest
            docker tag ghcr.io/$OWNER_LOWER/comfytag-partner:latest comfytag-partner:latest
            docker tag ghcr.io/$OWNER_LOWER/comfytag-admin:latest comfytag-admin:latest

            echo "📝 Recording the deployed commit..."
            echo "${{ github.sha }}" > DEPLOYED_COMMIT.txt
            echo "Deploying commit ${{ github.sha }} (previous: $PREVIOUS_COMMIT)"

            echo "🔄 Starting containers..."
            docker compose -f docker-compose.prod.yml up -d --no-build
            
            echo "♻️ Reloading Nginx to map new container IPs..."
            sudo systemctl reload nginx || true
            docker compose -f docker-compose.prod.yml exec -T nginx nginx -s reload || true
            
            echo "⏳ Waiting for services to stabilize..."
            sleep 15
            
            echo "🏥 Health checks..."
            for i in {1..10}; do
              if curl -f https://comfytag.com 2>/dev/null; then
                echo "✅ Production services healthy"
                break
              fi
              if [ $i -eq 10 ]; then
                echo "❌ Health check failed after 10 attempts"
                exit 1
              fi
              echo "Attempt $i/10..."
              sleep 3
            done
            
            echo "🧹 Cleaning up old images..."
            docker image prune -a -f
      - name: ✅ Production deployed successfully
        run: |
          echo "✅ Deployment complete!"
          echo "📍 Live at: http://${{ secrets.PRODUCTION_HOST }}"

  production-health:
    name: 🏥 Production Health Check
    needs: deploy-production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Verify production is healthy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          timeout: 10m
          command_timeout: 10m
          script: |
            cd /home/deploy/comfytag
            echo "🏥 Running production health checks..."
            echo "Checking containers..."
            docker compose -f docker-compose.prod.yml ps
            if docker compose -f docker-compose.prod.yml ps | grep -i "restarting"; then
              echo "❌ ERROR: Containers in restart loop!"
              docker compose -f docker-compose.prod.yml logs --tail 50
              exit 1
            fi
            echo ""
            echo "Checking logs for errors..."
            ERROR_COUNT=$(docker compose -f docker-compose.prod.yml logs --tail 100 2>&1 | grep -i "error\|critical" | wc -l)
            if [ "$ERROR_COUNT" -gt 5 ]; then
              echo "⚠️  High error count: $ERROR_COUNT"
              docker compose -f docker-compose.prod.yml logs --tail 20 2>&1 | grep -i "error\|critical"
            else
              echo "✅ Error count normal: $ERROR_COUNT"
            fi
            echo ""
            echo "✅ Production health check passed"

  notify-failure:
    name: 📢 Notify on Failure
    runs-on: ubuntu-latest
    needs: [quality-gate, docker-build, deploy-production, production-health]
    if: failure()
    steps:
      - name: Create failure issue
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `❌ Deployment failed: ${context.sha.substring(0, 7)}`,
              body: `**Deployment pipeline failed**\n\nCommit: ${context.sha}\nAuthor: ${context.actor}\n\n[View workflow logs](${context.server_url}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})\n\n**Action Required:**\n1. Check the workflow logs\n2. Fix the failing stage\n3. Push a new commit to retry`,
              labels: ['deployment', 'urgent']
            })
      - name: Slack notification
        uses: slackapi/slack-github-action@v1
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          payload: |
            {
              "text": "❌ ComfyTag Deployment Failed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*❌ Deployment Pipeline Failed*\n*Commit:* ${{ github.sha }}\n*Author:* ${{ github.actor }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Logs>"
                  }
                }
              ]
            }
        continue-on-error: true