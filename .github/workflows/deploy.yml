name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27018:27017
        env:
          MONGO_INITDB_ROOT_USERNAME: admin
          MONGO_INITDB_ROOT_PASSWORD: changeme
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.9

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests — utils + UI
        run: pnpm --filter "@comfytag/utils" --filter "@comfytag/ui" test

      - name: Integration tests — API (middleware + routes)
        run: pnpm --filter "@comfytag/api" test -- src/__tests__/middleware.test.ts src/__tests__/routes.test.ts --run

      - name: Integration tests — API (transfer + face, isolated)
        run: pnpm --filter "@comfytag/api" test -- src/__tests__/transfer.test.ts --run

      - name: Component tests — web + partner
        run: pnpm --filter "@comfytag/web" --filter "@comfytag/partner" test

  docker-validate:
    name: Docker Build & Validation
    needs: [test]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker images
        run: docker compose -f docker-compose.prod.yml build

      - name: Validate docker-compose configuration
        run: docker compose -f docker-compose.prod.yml config > /dev/null

      - name: Start containers for health check
        run: docker compose -f docker-compose.prod.yml up -d

      - name: Wait for services to be healthy
        run: sleep 15

      - name: Check container status
        run: |
          echo "Checking container health..."
          docker compose -f docker-compose.prod.yml ps

          # Verify no containers are in "Restarting" state
          if docker compose -f docker-compose.prod.yml ps | grep -i "restarting"; then
            echo "ERROR: Containers are in restart loop!"
            docker compose -f docker-compose.prod.yml logs
            exit 1
          fi

      - name: Verify critical files in Docker images
        run: |
          echo "Verifying critical files..."
          docker run --rm comfytag-web ls -la /app/apps/web/server.js
          docker run --rm comfytag-partner ls -la /app/apps/partner/server.js
          docker run --rm comfytag-admin ls -la /app/apps/admin/server.js
          echo "✓ All critical files present"

      - name: Test endpoints
        run: |
          echo "Testing endpoints..."
          curl -f http://localhost:3000 > /dev/null && echo "✓ Web responds" || exit 1
          curl -f http://localhost:3001 > /dev/null && echo "✓ Partner responds" || exit 1
          curl -f http://localhost:3002 > /dev/null && echo "✓ Admin responds" || exit 1
          echo "✓ All endpoints healthy"

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.prod.yml down

  deploy:
    name: SSH Deploy
    needs: [test, docker-validate]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Hetzner VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            cd /home/deploy/comfytag
            git pull origin main
            docker compose -f docker-compose.prod.yml build api
            docker compose -f docker-compose.prod.yml build web
            docker compose -f docker-compose.prod.yml build partner
            docker compose -f docker-compose.prod.yml build admin
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f

      - name: Post-deployment verification
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            cd /home/deploy/comfytag

            echo "Waiting for containers to stabilize..."
            sleep 10

            echo "Verifying deployment health..."
            docker compose -f docker-compose.prod.yml ps

            # Check for restart loops
            if docker compose -f docker-compose.prod.yml ps | grep -i "restarting"; then
              echo "ERROR: Containers in restart loop after deployment!"
              docker compose -f docker-compose.prod.yml logs --tail 50
              exit 1
            fi

            echo "✓ Deployment verification passed"
