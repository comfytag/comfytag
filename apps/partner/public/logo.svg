<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="200" height="200" rx="24" fill="#FFFFFF"/>

  <!-- Main gradient background for logo area -->
  <defs>
    <linearGradient id="gradientMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0EA5E9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06B6D4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradientAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06B6D4;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- QR Code Pattern (left side) -->
  <g>
    <!-- Main QR grid background -->
    <rect x="20" y="20" width="85" height="85" rx="6" fill="url(#gradientMain)" opacity="0.15"/>

    <!-- QR Pattern - stylized -->
    <g fill="#0EA5E9">
      <!-- Top-left finder pattern -->
      <rect x="28" y="28" width="8" height="8"/>
      <rect x="40" y="28" width="8" height="8"/>
      <rect x="28" y="40" width="8" height="8"/>
      <rect x="40" y="40" width="8" height="8"/>

      <!-- Top-right finder pattern -->
      <rect x="82" y="28" width="8" height="8"/>
      <rect x="94" y="28" width="8" height="8"/>
      <rect x="82" y="40" width="8" height="8"/>
      <rect x="94" y="40" width="8" height="8"/>

      <!-- Bottom-left finder pattern -->
      <rect x="28" y="82" width="8" height="8"/>
      <rect x="40" y="82" width="8" height="8"/>
      <rect x="28" y="94" width="8" height="8"/>
      <rect x="40" y="94" width="8" height="8"/>

      <!-- Data pattern -->
      <rect x="58" y="28" width="6" height="6"/>
      <rect x="68" y="28" width="6" height="6"/>
      <rect x="58" y="40" width="6" height="6"/>
      <rect x="68" y="50" width="6" height="6"/>
      <rect x="58" y="62" width="6" height="6"/>
      <rect x="68" y="72" width="6" height="6"/>
      <rect x="58" y="82" width="6" height="6"/>
      <rect x="68" y="92" width="6" height="6"/>
    </g>
  </g>

  <!-- Analytics Dashboard (right side) -->
  <g>
    <!-- Dashboard background card -->
    <rect x="110" y="20" width="70" height="85" rx="6" fill="url(#gradientAccent)" opacity="0.15"/>

    <!-- Chart bars -->
    <g fill="#10B981">
      <!-- Bar 1 -->
      <rect x="120" y="65" width="8" height="30" rx="2"/>
      <!-- Bar 2 -->
      <rect x="132" y="55" width="8" height="40" rx="2"/>
      <!-- Bar 3 -->
      <rect x="144" y="45" width="8" height="50" rx="2"/>
      <!-- Bar 4 -->
      <rect x="156" y="60" width="8" height="35" rx="2"/>
    </g>

    <!-- Trend line (upward) -->
    <polyline points="120,60 132,50 144,45 156,35" stroke="#06B6D4" stroke-width="3" fill="none" stroke-linecap="round"/>

    <!-- Data points -->
    <circle cx="120" cy="60" r="3" fill="#0EA5E9"/>
    <circle cx="132" cy="50" r="3" fill="#0EA5E9"/>
    <circle cx="144" cy="45" r="3" fill="#0EA5E9"/>
    <circle cx="156" cy="35" r="3" fill="#0EA5E9"/>
  </g>

  <!-- Center accent - Face recognition icon -->
  <g transform="translate(100, 110)">
    <!-- Face circle -->
    <circle cx="0" cy="0" r="20" fill="none" stroke="#06B6D4" stroke-width="2"/>
    <!-- Eyes -->
    <circle cx="-8" cy="-5" r="2" fill="#0EA5E9"/>
    <circle cx="8" cy="-5" r="2" fill="#0EA5E9"/>
    <!-- Smile arc -->
    <path d="M -8 3 Q 0 8 8 3" stroke="#10B981" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Bottom accent bar -->
  <rect x="20" y="160" width="160" height="3" rx="2" fill="url(#gradientAccent)"/>
</svg>
