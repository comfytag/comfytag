services:
  nginx:
    image: nginx:1.27-alpine
    container_name: comfytag-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - partner
      - admin
      - api
    networks:
      - comfytag-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: comfytag-web
    restart: unless-stopped
    env_file:
      - apps/web/.env
    networks:
      - comfytag-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  partner:
    build:
      context: .
      dockerfile: apps/partner/Dockerfile
    container_name: comfytag-partner
    restart: unless-stopped
    env_file:
      - apps/partner/.env
    networks:
      - comfytag-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "3001"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    container_name: comfytag-admin
    restart: unless-stopped
    env_file:
      - apps/admin/.env
    networks:
      - comfytag-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "3002"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: comfytag-api
    restart: unless-stopped
    env_file:
      - apps/api/.env
    depends_on:
      - redis
    networks:
      - comfytag-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "4002"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  redis:
    image: redis:7.2-alpine
    container_name: comfytag-redis-prod
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - comfytag-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  redis_data:

networks:
  comfytag-network:
    driver: bridge
