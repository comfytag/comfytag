<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Login - ComfyTag</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;display=swap" rel="stylesheet">

        theme: {
          extend: {

                    "surface-variant": "#e2e2e2",
                    "primary-fixed": "#eaddff",
                    "on-primary-fixed": "#25005a",
                    "inverse-on-surface": "#f1f1f0",
                    "on-secondary-container": "#fffbff",
                    "surface": "#f9f9f8",
                    "on-primary-container": "#ede0ff",
                    "primary": "#630ed4",
                    "on-tertiary": "#ffffff",
                    "on-primary": "#ffffff",
                    "error": "#ba1a1a",
                    "tertiary": "#704500",
                    "on-error": "#ffffff",
                    "primary-fixed-dim": "#d2bbff",
                    "on-surface": "#1a1c1c",
                    "surface-container-highest": "#e2e2e2",
                    "secondary": "#6e3aca",
                    "on-secondary-fixed-variant": "#581db3",
                    "outline": "#7b7487",
                    "inverse-surface": "#2f3130",
                    "on-primary-fixed-variant": "#5a00c6",
                    "on-error-container": "#93000a",
                    "background": "#f9f9f8",
                    "primary-container": "#7c3aed",
                    "on-tertiary-fixed": "#2a1700",
                    "surface-dim": "#dadad9",
                    "secondary-fixed": "#ebddff",
                    "outline-variant": "#ccc3d8",
                    "on-secondary": "#ffffff",
                    "surface-container": "#eeeeed",
                    "inverse-primary": "#d2bbff",
                    "tertiary-fixed-dim": "#ffb95f",
                    "on-tertiary-container": "#ffe1c0",
                    "on-tertiary-fixed-variant": "#653e00",
                    "surface-bright": "#f9f9f8",
                    "surface-container-high": "#e8e8e7",
                    "on-surface-variant": "#4a4455",
                    "on-background": "#1a1c1c",
                    "secondary-container": "#8856e5",
                    "on-secondary-fixed": "#250059",
                    "surface-container-low": "#f3f4f3",
                    "error-container": "#ffdad6",
                    "tertiary-fixed": "#ffddb8",
                    "surface-tint": "#732ee4",
                    "secondary-fixed-dim": "#d3bbff",
                    "tertiary-container": "#905b00",
                    "surface-container-lowest": "#ffffff"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "section-gap": "40px",
                    "base": "4px",
                    "stack-sm": "8px",
                    "stack-lg": "24px",
                    "stack-md": "16px",
                    "margin-tablet": "32px",
                    "gutter": "16px",
                    "margin-mobile": "20px"
            },
            "fontFamily": {
                    "headline-md": ["Inter"],
                    "body-md": ["Inter"],
                    "display-lg": ["Inter"],
                    "headline-lg": ["Inter"],

            },

                    "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "title-lg": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],

                    "headline-lg-mobile": ["26px", {"lineHeight": "32px", "fontWeight": "700"}]

          },
        },
      }

<style>
        body {
            background-color: #f9f9f8;
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .btn-scale:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center relative overflow-hidden">
<!-- Atmospheric Background Animation -->
<div class="fixed inset-0 z-0">

</div>
<!-- Main Navigation (Suppressed based on Transactional Flow logic, but branding maintained) -->
<header class="fixed top-0 w-full z-50 flex justify-center h-20 items-center">
<div class="font-headline-md text-headline-md font-extrabold text-primary tracking-tight">
            ComfyTag
        </div>
</header>
<!-- Login Container -->
<main class="z-10 w-full max-w-md px-margin-mobile">
<div class="bg-surface-container-lowest rounded-[24px] shadow-sm p-stack-lg flex flex-col gap-stack-lg border border-surface-variant/30">
<!-- Header Section -->
<div class="flex flex-col gap-base text-center">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-surface">Welcome back</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Enter your details to access your tickets.</p>
</div>
<!-- Form Section -->
<form class="flex flex-col gap-stack-md" onsubmit="event.preventDefault();">
<!-- Identifier Input -->
<div class="flex flex-col gap-base">
<label class="font-label-md text-label-md text-on-surface-variant ml-1" for="identifier">Email or Phone Number</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">alternate_email</span>
<input class="w-full h-14 pl-12 pr-4 bg-surface-container-low border-none rounded-xl font-body-lg text-body-lg focus:ring-2 focus:ring-primary/20 transition-all outline-none text-on-surface placeholder:text-outline-variant" id="identifier" placeholder="e.g. name@example.com" type="text">
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-base">
<div class="flex justify-between items-center ml-1">
<label class="font-label-md text-label-md text-on-surface-variant" for="password">Password</label>
<a class="font-label-md text-label-md text-primary hover:underline" href="#">Forgot?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">lock</span>
<input class="w-full h-14 pl-12 pr-12 bg-surface-container-low border-none rounded-xl font-body-lg text-body-lg focus:ring-2 focus:ring-primary/20 transition-all outline-none text-on-surface placeholder:text-outline-variant" id="password" placeholder="••••••••" type="password">
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface-variant transition-colors" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<!-- Action Button -->
<button class="w-full h-14 bg-primary text-on-primary font-title-lg text-title-lg rounded-xl shadow-lg btn-scale transition-transform duration-200 mt-2 flex items-center justify-center gap-base">
                    Continue
                    <span class="material-symbols-outlined">arrow_forward</span>
</button>
</form>
<!-- Divider -->
<div class="flex items-center gap-stack-md py-base">
<div class="h-px flex-1 bg-outline-variant/30"></div>
<span class="font-label-md text-label-md text-outline">OR</span>
<div class="h-px flex-1 bg-outline-variant/30"></div>
</div>
<!-- Social Logins -->
<div class="flex flex-col gap-stack-md">
<button class="w-full h-14 bg-surface-container-lowest border border-outline-variant/50 rounded-xl flex items-center justify-center gap-stack-md font-body-lg text-body-lg text-on-surface-variant btn-scale transition-all hover:bg-surface-container-low">
<img alt="Google" class="w-5 h-5" src="https://lh3.googleusercontent.com/aida-public/AB6AXuD-WK-IvG0Zv1ibZqkoOqr4jtAvuaGeIaKrupbQKKo5NAgh1rbHsKrUV2-ED31IIOaBsh4LBiMrABGhykmHsnWpIW_bTTMm071EFuDYz_Zy8KJLeC8InZ8rMy2xNY05SNIHnOKO_E5onhUmtF8Nc-MfvMn492jLcaN_EEhx2YQskPIQK7dClnm2Lco0qZFZ8DcrnFUIS7KYt7TuKhm7_5ZPfnMveJqTKCYzX3ULADXsRxvQo80EjouC_g">
                    Continue with Google
                </button>
<button class="w-full h-14 bg-surface-container-lowest border border-outline-variant/50 rounded-xl flex items-center justify-center gap-stack-md font-body-lg text-body-lg text-on-surface-variant btn-scale transition-all hover:bg-surface-container-low">
<span class="text-[#1877F2] font-bold text-lg leading-none">f</span>
                    Continue with Facebook
                </button>
</div>
<!-- Footer Sign-up Link -->
<div class="text-center pt-base">
<p class="font-body-md text-body-md text-on-surface-variant">
                    New to ComfyTag? <a class="text-primary font-bold hover:underline" href="#">Create account</a>
</p>
</div>
</div>
<!-- Trust Markers -->
<div class="mt-stack-lg flex justify-center gap-stack-lg opacity-60 grayscale hover:grayscale-0 transition-all duration-500">
<div class="flex items-center gap-base text-outline">
<span class="material-symbols-outlined text-[18px]">verified_user</span>
<span class="font-label-md text-label-md">Secure Encryption</span>
</div>
<div class="flex items-center gap-base text-outline">
<span class="material-symbols-outlined text-[18px]">gpp_good</span>
<span class="font-label-md text-label-md">PCI-DSS Compliant</span>
</div>
</div>
</main>
<!-- Background Decorative Elements -->
<div class="absolute -bottom-24 -left-24 w-96 h-96 bg-secondary-container/20 rounded-full blur-[100px] pointer-events-none"></div>
<div class="absolute -top-24 -right-24 w-96 h-96 bg-primary-container/20 rounded-full blur-[100px] pointer-events-none"></div>
<script>
        // Micro-interaction for input focusing
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.classList.add('ring-2', 'ring-primary/10');
            });
            input.addEventListener('blur', () => {
                input.parentElement.classList.remove('ring-2', 'ring-primary/10');
            });
        });

        // Toggle password visibility
        const toggleBtn = document.querySelector('button[type="button"]');
        const passInput = document.getElementById('password');
        if (toggleBtn) {
            toggleBtn.addEventListener('click', () => {
                const isPass = passInput.type === 'password';
                passInput.type = isPass ? 'text' : 'password';
                toggleBtn.querySelector('span').innerText = isPass ? 'visibility_off' : 'visibility';
            });
        }
    </script>
</body></html>
