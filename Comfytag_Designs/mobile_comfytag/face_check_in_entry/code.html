<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        @keyframes scan {
            0%, 100% { transform: translateY(0); opacity: 0.2; }
            50% { transform: translateY(320px); opacity: 1; }
        }
        
        .scan-line {
            animation: scan 3s ease-in-out infinite;
        }

        .pulse-soft {
            animation: pulse-soft 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes pulse-soft {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.85; transform: scale(1.02); }
        }

        .shimmer {
            background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.2) 50%, rgba(255,255,255,0) 100%);
            background-size: 200% 100%;
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>

<!-- We prioritize the Canvas for high-focus check-in -->
<script>
        // Simulate a face recognition process
        document.addEventListener('DOMContentLoaded', () => {
            const scanElement = document.getElementById('scan-element');
            const statusText = document.getElementById('status-text');
            const subStatusText = document.getElementById('sub-status-text');
            const verifiedIcon = document.getElementById('verified-icon');
            const successCard = document.getElementById('success-card');
            const statusContainer = document.getElementById('status-container');

            setTimeout(() => {
                // Phase 2: Processing
                statusText.innerText = "Analyzing Biometrics...";
                statusText.classList.remove('pulse-soft');
                
                setTimeout(() => {
                    // Phase 3: Success
                    scanElement.style.display = 'none';
                    verifiedIcon.classList.remove('hidden');
                    
                    statusText.innerText = "Verified";
                    statusText.classList.add('text-emerald-400');
                    subStatusText.innerText = "Welcome back, Chidi";
                    subStatusText.classList.add('text-emerald-400/80');

                    // Show detailed card
                    successCard.classList.remove('hidden');
                    
                    // Subtle haptic-like pulse on success
                    document.body.classList.add('bg-emerald-950/20');
                    setTimeout(() => document.body.classList.remove('bg-emerald-950/20'), 300);

                }, 2000);

            }, 2500);
        });

        // Toggle mobile drawer placeholder logic (simulation only)
        function toggleDrawer() {
            console.log('Navigation drawer would open here.');
        }
    </script>
