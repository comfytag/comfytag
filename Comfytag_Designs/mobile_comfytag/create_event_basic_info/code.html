<style>

            outline: none;
            border-color: #630ed4;

<body class="bg-surface text-on-surface font-body-lg min-h-screen pb-32">
<!-- Top Navigation Bar -->
<header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-xl shadow-sm h-16 flex justify-between items-center px-margin-mobile">
<div class="flex items-center gap-base">
<button class="p-2 active:scale-95 transition-transform duration-200">
<span class="material-symbols-outlined text-primary">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-primary tracking-tight">ComfyTag</h1>
</div>
<div class="w-8 h-8 rounded-full overflow-hidden border border-outline-variant">
<img class="w-full h-full object-cover" alt="A professional headshot of a young Nigerian event organizer with a warm smile, wearing a stylish minimalist blazer. The background is a soft-focus studio setting with warm amber backlighting and a clean, high-key modernist aesthetic that reflects luxury and efficiency." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDWXd6zIaN14Gjh9a4Vx2BLBC1AHRpvDO45UJ9SX1ppnbyzY6IMEyVsOY4Lr584D5o4pPuS4y7RPefR-Y1532OX1aqVJbBB9m10ZQWPtKiE6sflX4TMSCCirEwRDTqe4sXLHbpmx8iyh6vo9TJC1CGpR4CVh8vuJNvmXs0jGsf5SBexPNhZfV4evFV2ympEVfbxN_Tp_eNo75hpRCc9j8vYFIaZE-ry8FDaOX7CMujxD-29Dr-PB8ij4A"/>
</div>
</header>
<main class="pt-24 px-margin-mobile max-w-2xl mx-auto">
<!-- Progress Stepper -->
<section class="mb-stack-lg">
<div class="flex justify-between items-end mb-base">
<span class="font-label-md text-label-md text-on-surface-variant uppercase tracking-widest">Step 1 of 3</span>
<span class="font-title-lg text-title-lg text-primary">Basic Info</span>
</div>
<div class="h-1.5 w-full bg-surface-container-high rounded-full overflow-hidden">
<div class="h-full bg-primary w-1/3 rounded-full transition-all duration-700 ease-out"></div>
</div>
</section>
<!-- Form Content -->
<form class="space-y-stack-lg">
<!-- Hero Image Upload Placeholder -->
<div class="relative w-full aspect-video rounded-xl bg-surface-container-low border-2 border-dashed border-outline-variant flex flex-col items-center justify-center gap-stack-sm hover:bg-surface-container-high transition-colors cursor-pointer overflow-hidden group">
<span class="material-symbols-outlined text-4xl text-on-surface-variant group-hover:scale-110 transition-transform">add_a_photo</span>
<p class="font-body-md text-body-md text-on-surface-variant">Upload Event Cover</p>
<div class="absolute inset-0 opacity-10 mix-blend-overlay">
<div class="w-full h-full bg-gradient-to-br from-primary to-secondary"></div>
</div>
</div>
<!-- Event Title -->
<div class="premium-card bg-surface-container-lowest p-stack-lg rounded-xl border border-surface-variant/50">
<label class="block font-label-md text-label-md text-on-surface-variant mb-base" for="event-title">EVENT TITLE</label>
<input class="w-full bg-transparent border-b-2 border-surface-variant py-stack-sm font-title-lg text-title-lg focus:border-primary transition-colors placeholder:text-outline-variant" id="event-title" placeholder="e.g. Lagos Jazz Under The Stars" type="text"/>
</div>
<!-- Category & Subcategory -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-gutter">
<div class="premium-card bg-surface-container-lowest p-stack-lg rounded-xl border border-surface-variant/50">
<label class="block font-label-md text-label-md text-on-surface-variant mb-base" for="category">CATEGORY</label>
<div class="relative">
<select class="w-full bg-transparent border-none p-0 font-body-lg text-body-lg appearance-none cursor-pointer" id="category">
<option>Music & Concerts</option>
<option>Tech & Innovation</option>
<option>Food & Drink</option>
<option>Arts & Culture</option>
<option>Business & Finance</option>
</select>
<span class="material-symbols-outlined absolute right-0 top-1/2 -translate-y-1/2 pointer-events-none text-on-surface-variant">expand_more</span>
</div>
</div>
<div class="premium-card bg-surface-container-lowest p-stack-lg rounded-xl border border-surface-variant/50">
<label class="block font-label-md text-label-md text-on-surface-variant mb-base" for="sub-category">VISIBILITY</label>
<div class="flex gap-stack-sm mt-base">
<button class="px-stack-md py-base rounded-full bg-primary-fixed text-on-primary-fixed font-label-md text-label-md" type="button">Public</button>
<button class="px-stack-md py-base rounded-full border border-outline-variant text-on-surface-variant font-label-md text-label-md hover:bg-surface-variant transition-colors" type="button">Private</button>
</div>
</div>
</div>
<!-- Date & Time -->
<div class="premium-card bg-surface-container-lowest p-stack-lg rounded-xl border border-surface-variant/50">
<div class="flex items-center gap-stack-sm mb-stack-md">
<span class="material-symbols-outlined text-primary">calendar_today</span>
<h3 class="font-title-lg text-title-lg">Schedule</h3>
</div>
<div class="space-y-stack-md">
<div class="flex flex-col md:flex-row gap-gutter">
<div class="flex-1">
<label class="block font-label-md text-label-md text-on-surface-variant mb-base">START DATE</label>
<input class="w-full bg-surface-container-low px-stack-md py-stack-sm rounded-lg border-none font-body-md text-body-md" type="date"/>
</div>
<div class="flex-1">
<label class="block font-label-md text-label-md text-on-surface-variant mb-base">START TIME</label>
<input class="w-full bg-surface-container-low px-stack-md py-stack-sm rounded-lg border-none font-body-md text-body-md" type="time"/>
</div>
</div>
</div>
</div>
<!-- Location Section -->
<div class="premium-card bg-surface-container-lowest p-stack-lg rounded-xl border border-surface-variant/50">
<div class="flex items-center gap-stack-sm mb-stack-md">
<span class="material-symbols-outlined text-primary">location_on</span>
<h3 class="font-title-lg text-title-lg">Location</h3>
</div>
<div class="relative mb-stack-md">
<input class="w-full bg-surface-container-low px-stack-md py-3 pl-10 rounded-lg border-none font-body-md text-body-md placeholder:text-outline-variant" placeholder="Search for a venue or address..." type="text"/>
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant">search</span>
</div>

<div class="absolute inset-0 flex items-center justify-center">
<div class="bg-white/90 backdrop-blur-sm px-stack-md py-base rounded-full shadow-lg flex items-center gap-base">
<span class="material-symbols-outlined text-error" style="font-variation-settings: 'FILL' 1;">location_on</span>
<span class="font-label-md text-label-md">Pin location on map</span>
</div>
</div>
</div>
</div>

<!-- Bottom Action Bar -->
<footer class="fixed bottom-0 left-0 w-full bg-surface/80 backdrop-blur-xl p-margin-mobile flex justify-center z-50">
<button class="w-full max-w-2xl bg-secondary text-on-secondary py-stack-lg rounded-xl font-title-lg text-title-lg shadow-xl active:scale-[0.98] transition-transform duration-200 flex items-center justify-center gap-stack-sm">
            Next: Ticket Tiers
            <span class="material-symbols-outlined">arrow_forward</span>
</button>
</footer>
<!-- Micro-interaction script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const inputs = document.querySelectorAll('input, select');
            inputs.forEach(input => {
                input.addEventListener('focus', () => {
                    input.closest('.premium-card').classList.add('ring-1', 'ring-primary/20', 'shadow-md');
                });
                input.addEventListener('blur', () => {
                    input.closest('.premium-card').classList.remove('ring-1', 'ring-primary/20', 'shadow-md');
                });
            });

            // Smooth appear for the form elements
            const cards = document.querySelectorAll('.premium-card');
            cards.forEach((card, index) => {
                card.style.opacity = '0';
                card.style.transform = 'translateY(20px)';
                setTimeout(() => {
                    card.classList.add('step-transition');
                    card.style.opacity = '1';
                    card.style.transform = 'translateY(0)';
                }, 100 * index);
            });
        });
    </script>
</body></html>
