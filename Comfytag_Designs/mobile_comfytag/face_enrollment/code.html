<style>
    body {
      background-color: #f9f9f8;
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .scanning-line {
      position: absolute;
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, transparent, #630ed4, transparent);
      box-shadow: 0 0 15px #630ed4;
      animation: scan 3s ease-in-out infinite;
      z-index: 20;
    }

    @keyframes scan {
      0% { top: 10%; opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { top: 90%; opacity: 0; }
    }

    .pulse-ring {
      position: absolute;
      border: 2px solid #630ed4;
      border-radius: 50%;
      animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.5; }
      100% { transform: scale(1.1); opacity: 0; }
    }

    .glass-panel {
      backdrop-filter: blur(20px);
      background: rgba(255, 255, 255, 0.8);
    }
  </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col overflow-hidden">
<!-- Header Section (Suppressed Shell as per UX goal for transactional/focused journey) -->
<header class="fixed top-0 w-full z-50 flex items-center h-16 px-margin-mobile">
<button class="w-10 h-10 flex items-center justify-center rounded-full active:scale-95 transition-transform" onclick="window.history.back()">
<span class="material-symbols-outlined text-on-surface">arrow_back</span>
</button>
</header>
<main class="flex-1 flex flex-col items-center justify-center px-margin-mobile relative">
<!-- Background Decor -->
<div class="absolute inset-0 pointer-events-none opacity-20">

</div>
<!-- Content Container -->
<div class="w-full max-w-md flex flex-col items-center z-10">
<!-- Title & Context -->
<div class="text-center mb-section-gap">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-base">Set up your face</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Secure your tickets with facial biometric authentication.</p>
</div>
<!-- Camera Enrollment Area -->
<div class="relative w-72 h-72 md:w-80 md:h-80 mb-section-gap group">
<!-- Circular Rings -->
<div class="absolute inset-0 border-2 border-primary/20 rounded-full scale-105"></div>
<div class="pulse-ring inset-0"></div>
<!-- Main Circular Preview -->
<div class="relative w-full h-full rounded-full border-[3px] border-primary overflow-hidden bg-surface-container shadow-2xl">
<!-- Placeholder for Camera Stream -->
<div class="absolute inset-0 flex items-center justify-center overflow-hidden">
<img class="w-full h-full object-cover" alt="A premium, cinematic close-up of a diverse person's face being illuminated by soft violet digital scan lines in a bright, modern studio. The person is looking directly into the lens with a calm expression. High-key lighting highlights the contours of the face, reinforcing a high-tech biometric security theme with soft lavender and deep violet accents." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBO_7evHFYtqWMNx593APz_x48OMRob5KMkAZXyaENkHNFAiEX2FFI8Ew8FdAGkDf_nFTmuDdCSpkw0GhWzS97iwDKKKce0UOUaIyW6NRs_mSX1ZqRQySg8KbJy2gNo_L0WcQ8N7Xs3NZWjXkb565BFUs2toQ3eWX9348a5e1nFlcpqGfKY90lg5Iq1eiUG6a4wxpkkCInzWVkVr3Hh3yHEpm2q-IFMUUlJNXECHJT35e_Do3tAgeSMgQ">
</div>
<!-- Scanning Overlay Effect -->
<div class="scanning-line"></div>
<!-- Biometric Mesh Overlay (Visual Fluff) -->
<div class="absolute inset-0 opacity-30 pointer-events-none mix-blend-overlay">
<div class="w-full h-full grid grid-cols-6 grid-rows-6">
<!-- Grid elements to simulate technical overlay -->
<div class="border-r border-b border-white/20"></div>
<div class="border-r border-b border-white/20"></div>
<div class="border-r border-b border-white/20"></div>
<div class="border-r border-b border-white/20"></div>
<div class="border-r border-b border-white/20"></div>
<div class="border-b border-white/20"></div>
<!-- Repeat as needed for visual density -->
</div>
</div>
</div>
<!-- Feedback Indicator -->
<div class="absolute -bottom-4 left-1/2 -translate-x-1/2 glass-panel px-4 py-2 rounded-full border border-outline-variant/30 flex items-center gap-2 shadow-lg">
<span class="w-2 h-2 rounded-full bg-primary animate-pulse"></span>
<span class="font-label-md text-label-md text-on-surface-variant uppercase tracking-widest">Ready</span>
</div>
</div>
<!-- Instructions Section -->
<div class="flex flex-col items-center gap-stack-md w-full">
<div class="flex items-center gap-3 px-6 py-4 bg-surface-container-low rounded-xl w-full border border-outline-variant/10">
<span class="material-symbols-outlined text-primary">light_mode</span>
<p class="font-body-md text-body-md text-on-surface">Face the camera clearly in a well-lit area</p>
</div>
<div class="flex items-center gap-3 px-6 py-4 bg-surface-container-low rounded-xl w-full border border-outline-variant/10">
<span class="material-symbols-outlined text-primary">remove_circle_outline</span>
<p class="font-body-md text-body-md text-on-surface">Remove glasses or hats if necessary</p>
</div>
</div>
</div>
</main>
<!-- Footer Actions -->
<footer class="p-margin-mobile w-full flex flex-col gap-stack-md max-w-md mx-auto z-10 bg-background/80 backdrop-blur-md">
<button class="bg-primary text-on-primary w-full min-h-[56px] rounded-xl font-title-lg text-title-lg shadow-lg active:scale-[0.98] transition-all flex items-center justify-center gap-2">
<span>Start enrollment</span>
<span class="material-symbols-outlined">arrow_forward</span>
</button>
<button class="w-full py-4 text-on-surface-variant font-body-md text-body-md hover:bg-surface-variant/20 rounded-xl transition-colors">
      Remind me later
    </button>
</footer>

<div class="flex items-center gap-1">
<span class="material-symbols-outlined text-[16px]">lock</span>
<span class="text-[10px] font-bold uppercase tracking-tighter">Encrypted</span>
</div>
<div class="w-1 h-1 rounded-full bg-outline-variant"></div>
<div class="flex items-center gap-1">
<span class="material-symbols-outlined text-[16px]">verified_user</span>
<span class="text-[10px] font-bold uppercase tracking-tighter">GDPR Compliant</span>
</div>
</div>
<script>
    // Micro-interaction for the 'Start' button
    const startBtn = document.querySelector('button.bg-primary');
    startBtn.addEventListener('click', () => {
      startBtn.innerHTML = `
        <span class="flex items-center gap-2">
          <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          Initializing...
        </span>
      `;
      
      // Simulate navigation or process start
      setTimeout(() => {
        alert("Camera access requested. Please allow in your browser.");
        location.reload();
      }, 1500);
    });
  </script>
